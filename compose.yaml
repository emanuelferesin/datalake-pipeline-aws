# Servicios del proyecto.
# Agregá acá los que tu arquitectura necesite.
# Referencias en los labs del curso (cloud-foundations-lab):
#   - postgres (lab 02)
#   - minio (lab 02)
#   - localstack (lab 04+)
#   - redis, redpanda (labs siguientes)

services: 
  localstack:
    image: localstack/localstack:3
    container_name: datalake-localstack
    environment:
      SERVICES: iam,sts,s3,ec2,secretsmanager,autoscaling,sqs,logs
      AWS_DEFAULT_REGION: ${AWS_DEFAULT_REGION:-us-east-1}
    ports:
      - "4566:4566"
    volumes:
      - localstack-data:/var/lib/localstack
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4566/_localstack/health"]
      interval: 10s
      timeout: 5s
      retries: 10
  postgres:
    image: postgres:16
    container_name: datalake-postgres
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: appdb
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  localstack-data:
  postgres-data: